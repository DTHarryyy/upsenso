name: Deploy to Play Store

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > android/app/keystore.jks

      - name: Create prod flavor config
        run: |
          mkdir -p flavors
          printf '%s' '${{ secrets.PROD_FLAVOR_JSON }}' > flavors/prod.json
          grep -q "SUPABASE_URL" flavors/prod.json || (echo "ERROR: SUPABASE_URL missing from PROD_FLAVOR_JSON secret" && exit 1)
          grep -q "SUPABASE_ANON_KEY" flavors/prod.json || (echo "ERROR: SUPABASE_ANON_KEY missing from PROD_FLAVOR_JSON secret" && exit 1)

      - name: Install dependencies
        run: flutter pub get

      - name: Compute version
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "Build number: $BUILD_NUMBER"

      - name: Build App Bundle
        run: |
          flutter build appbundle --release \
            --dart-define-from-file=flavors/prod.json \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER \
            --obfuscate \
            --split-debug-info=build/debug-info/
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.ledgidy.pos
          releaseFiles: build/app/outputs/bundle/release/*.aab
          track: alpha
          status: completed
