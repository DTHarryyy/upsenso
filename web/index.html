<!DOCTYPE html><html><head>
  <!-- Base path — replaced by flutter build --base-href -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Upsenso — Manage your business smarter">

  <!-- PWA / iOS meta -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Upsenso">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Upsenso</title>
  <link rel="manifest" href="manifest.json">

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

  <!-- ── Network hints ──────────────────────────────────────────────────── -->
  <!-- DNS pre-connect for Supabase so the first API call skips DNS lookup -->
  <link rel="preconnect" href="https://ltcvjttxomshxaotrrki.supabase.co" crossorigin="">
  <link rel="dns-prefetch" href="https://ltcvjttxomshxaotrrki.supabase.co">

  <!-- Preload Flutter bootstrap script (critical path) -->
  <link rel="preload" href="flutter_bootstrap.js" as="script">

  <!-- Preload Drift WASM assets so IndexedDB opens without a stall on first
       DB query. The browser fetches these in parallel with the Flutter engine.
       type="application/wasm" lets the browser match this hint to the
       WebAssembly.instantiateStreaming() call Drift makes at runtime, preventing
       the "preloaded but not used" warning. drift_worker.js is a SharedWorker
       script — preload it as="worker" so the browser can correctly match it to
       the SharedWorker constructor call instead of discarding it as a plain script. -->
  <link rel="preload" href="sqlite3.wasm" as="fetch" crossorigin="" type="application/wasm">
  <link rel="preload" href="drift_worker.js" as="worker">

  <!-- ── Web Renderer ───────────────────────────────────────────────────────
    Flutter ≥ 3.24 defaults to SkWasm on Chrome/Edge (fastest, sharpest text).
    CanvasKit is the fallback for unsupported browsers.
    The renderer is baked into flutter_bootstrap.js at build time — it CANNOT
    be changed from index.html.  To choose at build time:
      SkWasm  (default, recommended): flutter build web --web-renderer skwasm
      CanvasKit (wider browser support): flutter build web --web-renderer canvaskit
    Both renderers draw entirely inside a <canvas> / WebGL surface; CSS
    font-smoothing does NOT affect Flutter canvas content directly.  However the
    rules below improve the loading-screen text, any HTML-mode fallback content,
    and help the browser composite the canvas cleanly.
  ──────────────────────────────────────────────────────────────────────────── -->

  <!-- ── Styles ─────────────────────────────────────────────────────────── -->
  <style>
    html, body {
      height: 100%;
      margin: 0;
      /* Match app scaffold background so there is no flash on first paint */
      background-color: #F7F9FC;

      /* ── Text rendering ────────────────────────────────────────────────
         antialiased  → subpixel AA off; single-channel AA on.  Looks sharper
                        on high-DPI displays and matches how native web apps render.
         grayscale    → macOS equivalent of antialiased for -moz-.
         optimizeLegibility → enables kerning & ligatures; small perf cost but
                              measurable readability improvement for UI text.
         font-feature-settings → OpenType kerning + standard ligatures + contextual
                                  alternates; aligns with Inter's intended rendering.
      ──────────────────────────────────────────────────────────────────── */
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
    }

    /* Prevent the browser from applying extra text-size inflation on mobile
       (iOS Safari does this when the element has a small font-size).          */
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    /* ── HTML loading screen ─────────────────────────────────────────────
       Rendered natively by the browser while the Flutter engine downloads.
       Flutter's canvas paints on top once it's ready; we then fade this out.
    ──────────────────────────────────────────────────────────────────────── */
    #flutter-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 9999;
      transition: opacity 0.25s ease;
    }
    #flutter-loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .fl-logo {
      width: 80px;
      height: 80px;
      background: #EAF0FF;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .fl-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #EAF0FF;
      border-top-color: #557FF4;
      border-radius: 50%;
      animation: fl-spin 0.7s linear infinite;
    }
    @keyframes fl-spin { to { transform: rotate(360deg); } }
  </style>
  
  
  
  
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #4569ff;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  
  
  <!-- Visible immediately — dismissed on flutter-first-frame event -->
  <div id="flutter-loading" aria-label="Loading Upsenso" role="status">
    <div class="fl-logo">
      <!-- Store icon in brand colour — no external request needed -->
      <svg width="40" height="40" fill="none" aria-hidden="true" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="#557FF4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        <polyline points="9 22 9 12 15 12 15 22" stroke="#557FF4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></polyline>
      </svg>
    </div>
    <div class="fl-spinner"></div>
  </div>

  <!-- ── Device Pixel Ratio normalisation ──────────────────────────────────
    On Windows with non-integer display scaling (e.g. 125 % → DPR 1.25) the
    Flutter CanvasKit engine creates a WebGL canvas whose buffer size equals
    cssSize × devicePixelRatio.  At non-standard window widths (e.g. 1537 px)
    the product is fractional (1537 × 1.25 = 1921.25), so the browser must
    interpolate the canvas during compositing → blur.  The blur appears mainly
    at 100 % browser zoom because that is where the raw OS-level DPR is used
    directly; other zoom levels happen to produce a different (sometimes
    integer) effective DPR.

    Fix: wrap the native getter so every caller (Flutter, browser paint) sees
    Math.ceil(nativeDPR).  At 1.25 → 2, Flutter creates a 2 × canvas
    (Retina-equivalent quality).  The browser composites correctly because
    Math.ceil always returns a value ≥ actual DPR.  Using the live getter (not
    a captured constant) means browser zoom changes are still reflected.
  ──────────────────────────────────────────────────────────────────────── -->
  <!-- Shim Intl.v8BreakIterator → Intl.Segmenter to suppress the Chrome
       deprecation warning emitted by the Dart web SDK's text-segmentation code.
       Defining an own property on Intl shadows the deprecated built-in so Chrome's
       warning tracker never fires. Falls back gracefully when Segmenter is absent. -->
  <script>
    (function () {
      if (typeof Intl === 'undefined' || typeof Intl.Segmenter === 'undefined') return;
      function V8BreakIterator(locales, opts) {
        var type = (opts && opts.type) || 'word';
        var gran = type === 'character' ? 'grapheme'
                 : type === 'sentence'  ? 'sentence' : 'word';
        var seg = new Intl.Segmenter(locales, { granularity: gran });
        var _breaks = [], _idx = 0;
        return {
          adoptText: function (text) {
            _idx = 0; _breaks = [];
            for (var s of seg.segment(text)) _breaks.push(s.index);
            _breaks.push(text.length);
          },
          first:     function () { _idx = 0; return _breaks[0] != null ? _breaks[0] : 0; },
          next:      function () { _idx++; return _idx < _breaks.length ? _breaks[_idx] : -1; },
          current:   function () { return _breaks[_idx] != null ? _breaks[_idx] : 0; },
          breakType: function () { return 'none'; },
        };
      }
      V8BreakIterator.supportedLocalesOf = function () { return []; };
      try {
        Object.defineProperty(Intl, 'v8BreakIterator', {
          value: V8BreakIterator, writable: true, configurable: true, enumerable: false,
        });
      } catch (e) { /* read-only in this browser — leave as-is */ }
    })();
  </script>

  <script>
    (function () {
      try {
        var proto = Object.getPrototypeOf(window);
        var desc  = Object.getOwnPropertyDescriptor(proto, 'devicePixelRatio');
        if (desc && desc.get) {
          Object.defineProperty(window, 'devicePixelRatio', {
            get: function () { return Math.ceil(desc.get.call(this)); },
            configurable: true,
          });
        }
      } catch (e) { /* leave DPR unchanged on unsupported browsers */ }
    })();
  </script>

  <script src="flutter_bootstrap.js" async=""></script>

  <script>
    // Flutter dispatches 'flutter-first-frame' when the first frame is painted.
    // Use this to fade out and remove the HTML loading screen cleanly.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('flutter-loading');
      if (!el) return;
      el.classList.add('hidden');
      // Remove from DOM after the fade transition completes.
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>

</body></html>
